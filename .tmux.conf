# ask for new window name
set-window-option -g automatic-rename off
# bind-key c command-prompt -p "window name:" "new-window\; rename-window '%%'"
bind-key c new-window \; command-prompt -p "Name for this new window: " "rename-window '%%'"
bind C-l send-keys 'C-l'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# Allow tmux passthrough for osc52 based vim yanking (tmux >=3.3)
#set-option -g allow-passthrough on
# set -gq allow-passthrough on
set -s set-clipboard on

# Allow tmux osc52 based vim yanking (tmux <3.3)
# set -as terminal-features ',xterm-kitty:clipboard'
# set -s set-clipboard on
# set -s copy-command 'xsel -i'

# bind -T copy-mode-vi C-j               send -X copy-pipe-and-cancel 'xsel -i'
# bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel 'xsel -i'
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xsel -i'

# Tmux pane navigation
set -g @navigate-left  '-n C-h'
set -g @navigate-down  '-n C-j'
set -g @navigate-up    '-n C-k'
set -g @navigate-right '-n C-l'
set -g @navigate-back  '-n C-\'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'sunaku/tmux-navigate'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Set terminal overrides for kitty images to work
set -g default-terminal "xterm-kitty"
# set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0
set -as terminal-features ',xterm-kitty:clipboard,xterm-kitty:RGB'
set -gq allow-passthrough on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
